{% extends "base.html" %}

{% block header %}
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">&#128230; xarchive</h1>
        <div id="sync-button" class="sync-container"
             hx-get="/sync/status"
             hx-trigger="load"
             hx-swap="outerHTML">
            <span class="text-gray-400 text-sm">Loading...</span>
        </div>
    </div>
</header>
{% endblock %}

{% block content %}
{% include "partials/search_bar.html" %}

<div id="post-list"
     hx-get="/posts"
     hx-trigger="load, postsChanged from:body"
     hx-swap="innerHTML">
    {# Loading skeleton #}
    <div class="mt-4 space-y-3" aria-busy="true" aria-label="Loading posts">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>
</div>
{% endblock %}
