<div id="sync-button" class="sync-container">
    {% if state == "running" %}
        <button type="button" disabled aria-label="Syncing"
                class="p-2 rounded-lg bg-hover text-primary text-lg">
            <span class="inline-block animate-spin">&#128260;</span>
        </button>
        <script>setTimeout(function(){ htmx.ajax('GET', '/sync/status', {target: '#sync-button', swap: 'outerHTML'}) }, 2000);</script>

    {% elif state == "success" %}
        <button hx-post="/sync"
                hx-target="#sync-button"
                hx-swap="outerHTML"
                aria-label="Sync again ({{ new_count }} new, {{ updated_count }} updated)"
                title="{{ new_count }} new, {{ updated_count }} updated"
                class="p-2 rounded-lg bg-hover text-primary text-lg">&#10003;</button>

    {% elif state == "error" %}
        <button hx-post="/sync"
                hx-target="#sync-button"
                hx-swap="outerHTML"
                aria-label="Retry sync"
                title="{{ error_message | default('Sync failed') }}"
                class="p-2 rounded-lg bg-hover text-red-500 text-lg">&#10007;</button>

    {% else %}
        {# idle state — icon-only button, no text #}
        <form hx-post="/sync"
              hx-target="#sync-button"
              hx-swap="outerHTML"
              class="inline-flex">
            <button type="submit"
                    aria-label="Sync likes"
                    title="Sync likes"
                    class="p-2 rounded-lg bg-hover text-primary text-lg">&#128260;</button>
        </form>
    {% endif %}
</div>
