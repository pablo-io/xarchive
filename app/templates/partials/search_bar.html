<form hx-get="/posts"
      hx-target="#post-list"
      hx-swap="innerHTML"
      hx-trigger="input changed delay:300ms from:#search-q, change from:.search-field, submit"
      hx-push-url="true"
      hx-indicator="#search-spinner"
      class="card-bg rounded-xl shadow-sm border border-themed p-4 mb-2">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <div class="lg:col-span-2">
            <label for="search-q" class="sr-only">Search text</label>
            <input type="search" id="search-q" name="q" value="{{ q | default('') }}"
                   placeholder="Search posts..."
                   class="search-field w-full px-3 py-2 border border-themed card-bg text-primary rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   autocomplete="off">
        </div>
        <div>
            <label for="search-username" class="sr-only">Username</label>
            <input type="text" id="search-username" name="username" value="{{ username | default('') }}"
                   placeholder="@username"
                   class="search-field w-full px-3 py-2 border border-themed card-bg text-primary rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   autocomplete="off">
        </div>
        <div>
            <label class="date-compact-btn relative w-full" id="label-date-from">
                <input type="date" id="search-date-from" name="date_from"
                       value="{{ date_from | default('') }}"
                       class="search-field absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                       onchange="updateDateLabel('date-from', this.value)">
                <span class="date-compact-text pointer-events-none">📅 {{ date_from if date_from else 'Inicio' }}</span>
            </label>
        </div>
        <div>
            <label class="date-compact-btn relative w-full" id="label-date-to">
                <input type="date" id="search-date-to" name="date_to"
                       value="{{ date_to | default('') }}"
                       class="search-field absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                       onchange="updateDateLabel('date-to', this.value)">
                <span class="date-compact-text pointer-events-none">📅 {{ date_to if date_to else 'Fin' }}</span>
            </label>
        </div>
    </div>
    <div class="flex items-center gap-3 mt-3">
        <div>
            <label for="search-source" class="sr-only">Source filter</label>
            <select id="search-source" name="source"
                    class="search-field px-3 py-2 border border-themed card-bg text-primary rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="all" {{ 'selected' if source | default('all') == 'all' }}>All sources</option>
                <option value="like" {{ 'selected' if source | default('') == 'like' }}>&#10084;&#65039; Likes</option>
                <option value="bookmark" {{ 'selected' if source | default('') == 'bookmark' }}>&#128278; Bookmarks</option>
            </select>
        </div>
        <span id="search-spinner" class="htmx-indicator">
            <span class="inline-block animate-spin text-blue-500">&#10227;</span>
        </span>
        <div class="ml-auto flex gap-2">
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                Search
            </button>
            <button type="button" onclick="this.closest('form').reset(); htmx.trigger(this.closest('form'), 'submit');"
                    class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition text-sm font-medium">
                Clear
            </button>
        </div>
    </div>
</form>

<script>
    function updateDateLabel(id, value) {
        var span = document.querySelector('#label-' + id + ' .date-compact-text');
        if (span) span.textContent = value ? '📅 ' + value : (id === 'date-from' ? 'Inicio' : 'Fin');
    }
</script>
