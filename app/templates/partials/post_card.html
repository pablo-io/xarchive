<article class="card-bg rounded-xl shadow-sm border border-themed p-4 mb-3 hover:shadow-md transition-shadow">
    <div class="flex items-start gap-3">
        <img src="{{ post.author_avatar }}"
             class="w-10 h-10 rounded-full flex-shrink-0 object-cover"
             alt="" loading="lazy"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23e5e7eb%22 width=%2240%22 height=%2240%22/><text x=%2220%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2216%22>?</text></svg>'">
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-primary truncate">{{ post.author_name }}</span>
                <span class="text-sm text-secondary truncate">@{{ post.author_username }}</span>
                <span class="text-sm text-secondary">&middot; {{ post.created_at_display }}</span>
                {% if post.is_like %}
                <span class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full font-medium">&#10084;&#65039; like</span>
                {% endif %}
            </div>
            <p class="text-primary mt-1 whitespace-pre-wrap break-words leading-relaxed">{{ post.text_html | safe }}</p>
            {% if post.media_urls %}
            <div class="media-grid mt-2">
                {% for url in post.media_urls[:4] %}
                 <img src="{{ url }}"
                      class="media-grid-item rounded-lg border border-themed"
                      alt="media attachment" loading="lazy">
                {% endfor %}
            </div>
            {% endif %}
            <div class="mt-2">
                <a href="{{ post.url }}" target="_blank" rel="noopener"
                   class="text-sm text-blue-600 hover:underline inline-flex items-center gap-1">
                    &#128279; Open original
                </a>
            </div>
        </div>
    </div>
</article>
